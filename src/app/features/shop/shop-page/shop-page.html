<section class="hero">
  <div class="container hero__inner">
    <div class="hero__text">
      <p class="hero__label">The Collection</p>
      <h1 class="hero__title">Furniture for considered living</h1>
    </div>

    <p class="hero__description">
      Explore enduring forms in honest materials, designed for everyday life.
    </p>
  </div>
</section>

<app-filter-bar />

<section class="products">
  <div class="container">
    @if (products().length) {
      <div class="products__grid">
        @for (product of products(); track product.id) {
          <app-product-card [product]="product" />
        }
      </div>

      <app-pagination
        [currentPage]="service.currentPage()"
        [totalPages]="service.totalPages()"
        (pageChange)="service.goToPage($event)"
      />
    } @else {
      <p class="products__empty">No pieces match your filters.</p>
    }
  </div>
</section>
